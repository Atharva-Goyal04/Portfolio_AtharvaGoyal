name = "lumen-cdn"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "lumen-photos"

[observability]
enabled = true

# Secrets are injected at deploy time and must NOT be committed here:
#   wrangler secret put R2_ACCOUNT_ID
#   wrangler secret put R2_ACCESS_KEY_ID
#   wrangler secret put R2_SECRET_ACCESS_KEY
#   wrangler secret put R2_BUCKET_NAME
# (or set locally in workers/cdn-worker/.dev.vars which is git-ignored)